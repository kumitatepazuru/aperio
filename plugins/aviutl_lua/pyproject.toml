[project]
name = "aviutl-lua-plugin"
version = "1.0.0"
description = "AviUtl compatible Lua script effects for Aperio"
requires-python = ">=3.14"
dependencies = [
    "lua-runtime",
]

[dependency-groups]
dev = ["aperio-plugin-stubs"]

[tool.uv.sources]
aperio-plugin-stubs = { workspace = true }
lua-runtime = { workspace = true }

[project.entry-points."aperio.plugins"]
aviutl_lua = "aviutl_lua:AviutlLuaPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aviutl_lua"]
