name: Build GStreamer (Cerbero)

# タグプッシュまたは手動実行でトリガー
on:
  workflow_dispatch:
  push:
    tags:
      - "gstreamer-*"

jobs:
  build:
    name: ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 480 # Cerberoのビルドは数時間かかる

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux amd64
          - runner: ubuntu-latest
            artifact_name: linux-amd64
            cerbero_shell: bash

          # Linux arm64 (GitHub hosted ARM runner)
          - runner: ubuntu-24.04-arm
            artifact_name: linux-arm64
            cerbero_shell: bash

          # macOS arm64 (Apple Silicon)
          - runner: macos-14
            artifact_name: macos-arm64
            cerbero_shell: bash

          # Windows amd64 (native)
          - runner: windows-2022
            artifact_name: windows-amd64
            msystem: UCRT64
            cerbero_flags: ""
            cerbero_shell: msys2 -eo pipefail {0}

          # Windows arm64 (cross-win-arm64.cbc によるクロスコンパイル)
          # TODO: どうやらこのクロスコンパイルは使用できない機能などもあるようなので、アップデートがあるまで一旦コメントアウトしておく
          # see: https://gitlab.freedesktop.org/gstreamer/cerbero/-/work_items/548

          # - runner: windows-2022
          #   artifact_name: windows-cross-arm64
          #   msystem: UCRT64
          #   cerbero_flags: "-c config/cross-win-arm64.cbc"
          #   cerbero_shell: msys2 -eo pipefail {0}

    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: | 
            .github/actions/cerbero-build/action.yml
            .github/actions/cerbero-build/free_disk_space.sh
          sparse-checkout-cone-mode: false
      # ── Windows のみ: MSYS2 セットアップ (Bootstrap まで) ─────────────────────
      - name: Setup Python >= 3.10 (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '>=3.10'

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          release: false
          msystem: ${{ matrix.msystem }}
          path-type: inherit
          cache: true
          install: >-
            mingw-w64-ucrt-x86_64-jq m4 mingw-w64-ucrt-x86_64-gcc-libs
            mingw-w64-ucrt-x86_64-libwinpthread-git bison
            mingw-w64-ucrt-x86_64-diffutils flex mingw-w64-ucrt-x86_64-gperf
            mingw-w64-ucrt-x86_64-autotools mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-perl

      - name: Enable long file paths (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force

      - name: Set Extra MSYS2 flags (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Add-Content "C:\msys64\ucrt64.ini" "`nCHERE_INVOKING=1"
          Add-Content "C:\msys64\ucrt64.ini" "`nMSYS2_NOSTART=yes"
          Add-Content "C:\msys64\ucrt64.ini" "`nMSYS=winsymlinks:nativestrict"

      - name: Set Git autocrlf (Windows)
        if: runner.os == 'Windows'
        shell: msys2 -eo pipefail {0}
        run: git config --global core.autocrlf false

      # ── Cerbero を取得 ──────────────────────────────────────────────────────
      - name: Clone Cerbero
        shell: bash
        run: git clone --depth=1 https://github.com/GStreamer/cerbero.git cerbero

      # ── Bootstrap ──────────────────────────────────────────────────────────
      # mingw64/bin の git より C:\Program Files\Git\bin の native git を優先させる
      - name: Prepend native Git to PATH (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          "C:\Program Files\Git\cmd" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run Bootstrap (Windows)
        if: runner.os == 'Windows'
        working-directory: cerbero
        shell: powershell
        run: |
          Set-ExecutionPolicy -ExecutionPolicy Unrestricted
          .\tools\bootstrap-windows.ps1 -VSVersion '2022'

      - name: Remove Huge Packages (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash .github/actions/cerbero-build/free_disk_space.sh

      - name: Bootstrap (Linux)
        if: runner.os == 'Linux'
        working-directory: cerbero
        run: sudo apt update && python3 ./cerbero-uninstalled bootstrap -y

      - name: Install coreutils for macOS
        if: runner.os == 'macOS'
        run: brew install coreutils

      - name: Bootstrap (macOS)
        if: runner.os == 'macOS'
        working-directory: cerbero
        run: ./cerbero-uninstalled bootstrap -y

      # ── 共通ビルドステップ (.github/actions/cerbero-build) ──────────────────
      - uses: ./.github/actions/cerbero-build
        with:
          cerbero_shell: ${{ matrix.cerbero_shell }}
          cerbero_flags: ${{ matrix.cerbero_flags }}
          artifact_name: ${{ matrix.artifact_name }}
