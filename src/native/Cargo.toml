[package]
name = "aperio"
version.workspace = true
authors.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
napi = { workspace = true }
napi-derive = { workspace = true }
aperio_derive = { path = "../macros" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio-tungstenite = "0.28.0"
toml_edit = "0.23.7"
thiserror = "2.0.17"
gpu_util = { path = "../gpu_util" }
text_rendering = { path = "../text_rendering" }
avloader = { path = "../avloader" }
numpy = "0.28.0"
tokio = { workspace = true, features = ["macros", "sync"] }
pyo3 = { workspace = true, features = ["experimental-inspect", "anyhow"]}
anyhow = { workspace = true }
env_logger = "0.11.8"
log = { workspace = true }
wgpu = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.178"

[build-dependencies]
napi-build = "2"
