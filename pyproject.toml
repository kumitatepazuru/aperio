[project]
name = "aperio"
version = "0.1.0"
description = "A Plugin-based Open Source Video Editor"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mypy>=1.18.2",
    "numpy>=2.4.4",
    "requests>=2.32.5",
]

# 開発用環境(tools/ の実行、プラグイン開発時の型チェック)のためのプロジェクトで、
# それ自体はパッケージとしてビルド・配布しない。
[tool.uv]
package = false

# プラグイン(plugins/)の型チェックは、tools/stubgen.py が生成するスタブを参照する。
[tool.mypy]
mypy_path = ["build/stub"]
